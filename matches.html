<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Matches | PlayZest11</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-level-1 {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }
        .pulse-live {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        body {
            background-color: #0c1609;
            color: #dae6d0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for filter container */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .filter-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #dae6d0;
        }
        .filter-btn.active {
            background: #39ff14;
            color: #0c1609;
            border-color: #39ff14;
            font-weight: bold;
        }
    </style>
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#2ae500",
                      "primary-container": "#39ff14",
                      "on-primary-container": "#107100",
                      "on-surface-variant": "#baccb0",
                      "background": "#0c1609",
                      "surface-container-highest": "#2d3828",
                      "on-surface": "#dae6d0",
                      "surface": "#0c1609",
                      "error": "#ffb4ab",
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container pb-20">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-lg shadow-black/20">
    <div class="flex justify-between items-center w-full px-5 h-16 max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <i class="fas fa-trophy text-primary-container text-2xl"></i>
            <span class="text-xl font-black tracking-tighter text-primary-container hidden sm:block">PlayZest11</span>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="user-info" class="flex items-center gap-2 glass-level-1 px-3 py-1.5 rounded-full border border-white/10">
                <div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs">U</div>
                <span id="user-name" class="text-sm font-semibold truncate max-w-[100px]">User</span>
            </div>
            <button onclick="logout()" class="text-xs font-semibold text-error hover:text-red-400 transition-colors">Logout</button>
        </div>
    </div>
</header>

<main class="pt-24 px-5 max-w-7xl mx-auto">
    
    <div class="flex justify-between items-end mb-6">
        <div>
            <span class="text-primary-container text-xs font-bold uppercase tracking-widest pulse-live inline-block mb-1">Live Arena</span>
            <h1 class="text-3xl font-bold">Matches</h1>
        </div>
        <div class="text-right">
            <span class="text-xs text-on-surface-variant">Wallet Balance</span>
            <div id="header-wallet-balance" class="text-lg font-bold text-primary-container">₹0</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="flex overflow-x-auto gap-3 pb-4 mb-2 no-scrollbar">
        <button class="filter-btn active px-5 py-2 rounded-full text-sm whitespace-nowrap transition-all" onclick="filterMatches('All', this)">All Matches</button>
        <button class="filter-btn px-5 py-2 rounded-full text-sm whitespace-nowrap transition-all" onclick="filterMatches('T20', this)">T20</button>
        <button class="filter-btn px-5 py-2 rounded-full text-sm whitespace-nowrap transition-all" onclick="filterMatches('ODI', this)">ODI</button>
        <button class="filter-btn px-5 py-2 rounded-full text-sm whitespace-nowrap transition-all" onclick="filterMatches('TEST', this)">Test</button>
    </div>

    <!-- Loader -->
    <div id="loader" class="flex justify-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary-container"></div>
    </div>

    <!-- Match List Grid -->
    <div id="matches-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
        <!-- Matches will be injected here -->
    </div>
</main>

<!-- Bottom Navigation Bar for Mobile & Desktop -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-highest/90 backdrop-blur-xl border-t border-white/10 pb-safe">
    <div class="flex justify-around items-center h-16 max-w-7xl mx-auto px-2">
        <a href="matches.html" class="flex flex-col items-center justify-center w-full h-full text-primary-container relative">
            <div class="absolute -top-1 w-8 h-1 bg-primary-container rounded-b-full"></div>
            <span class="material-symbols-outlined mb-1">sports_cricket</span>
            <span class="text-[10px] font-semibold">Matches</span>
        </a>
        <a href="contest.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">groups</span>
            <span class="text-[10px] font-semibold">My Team</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">account_balance_wallet</span>
            <span class="text-[10px] font-semibold">Wallet</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">person</span>
            <span class="text-[10px] font-semibold">Profile</span>
        </a>
    </div>
</nav>

<script>
    // --- Authentication Check ---
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user || !user.loggedIn) {
        alert("Please login first! 🔒");
        window.location.href = "login.html";
    } else {
        document.getElementById("user-name").innerText = user.name;
        document.querySelector("#user-info div").innerText = user.name.charAt(0).toUpperCase();
        // Load local wallet balance for header display (optional, normally fetched from firebase)
        const balance = localStorage.getItem('walletBalance') || '0';
        document.getElementById('header-wallet-balance').innerText = `₹${balance}`;
    }

    function logout() {
        localStorage.removeItem("user");
        alert("Logged out successfully! 👋");
        window.location.href = "login.html";
    }

    // --- Matches Logic ---
    const API_KEY = "ca45e05030msh7563ba3172e2db6p19d36ejsne2c5d1ed2654";
    const API_URL = "https://cricbuzz-cricket.p.rapidapi.com/matches/v1/recent";
    let allMatches = [];

    async function fetchMatches() {
        const options = {
            method: 'GET',
            headers: {
                'x-rapidapi-key': API_KEY,
                'x-rapidapi-host': 'cricbuzz-cricket.p.rapidapi.com'
            }
        };

        try {
            const response = await fetch(API_URL, options);
            const data = await response.json();
            allMatches = data.typeMatches.flatMap(tm => tm.seriesMatches.flatMap(sm => sm.seriesAdWrapper ? sm.seriesAdWrapper.matches : []));
            if(allMatches.length === 0) throw new Error("No Matches Found");
        } catch (error) {
            console.error("API failed", error);
            allMatches = [];
        }
        
        document.getElementById('loader').style.display = 'none';
        document.getElementById('matches-list').classList.remove('hidden');
        renderMatches(allMatches);
    }

    function renderMatches(matchesToRender) {
        const list = document.getElementById('matches-list');
        list.innerHTML = "";
        
        if (matchesToRender.length === 0) {
            list.innerHTML = `<div class="col-span-full text-center py-10 text-on-surface-variant">No matches found for this filter.</div>`;
            return;
        }

        matchesToRender.forEach(m => {
            const info = m.matchInfo || m;
            const t1 = info.team1 ? info.team1.teamSName : "TBA";
            const t2 = info.team2 ? info.team2.teamSName : "TBA";
            const state = info.state || "N/A";
            const format = info.matchFormat || "T20";
            
            // Deterministic prize pool based on matchId
            const seed = parseInt(info.matchId) || 12345;
            const prizePool = "₹" + ((seed % 10) + 1) + " CR";
            
            const isLive = state.toUpperCase() === 'LIVE';
            const stateIndicator = isLive 
                ? `<div class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-error pulse-live"></span><span class="text-xs text-error font-bold uppercase">Live</span></div>`
                : `<span class="text-xs text-on-surface-variant font-bold uppercase">${state}</span>`;

            list.innerHTML += `
                <div class="glass-level-1 rounded-xl overflow-hidden border border-white/10 hover:border-primary-container/50 transition-colors group">
                    <div class="bg-white/5 px-4 py-2 flex justify-between items-center border-b border-white/5">
                        <span class="text-xs font-semibold text-on-surface-variant truncate mr-2">${info.seriesName || "Tournament"} • ${format}</span>
                        ${stateIndicator}
                    </div>
                    
                    <div class="p-5 flex justify-between items-center">
                        <div class="flex flex-col items-center gap-2">
                            <div class="w-14 h-14 rounded-full bg-white/5 flex items-center justify-center border border-white/10 group-hover:border-primary-container/30 transition-colors">
                                <span class="font-black text-lg">${t1.substring(0,3)}</span>
                            </div>
                            <span class="font-bold text-sm truncate max-w-[60px]">${t1}</span>
                        </div>
                        
                        <div class="text-center px-2">
                            <div class="text-xs text-on-surface-variant font-bold mb-2">VS</div>
                            <div class="bg-primary-container/10 px-3 py-1 rounded-full text-xs font-bold text-primary-container border border-primary-container/20">
                                ${prizePool}
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-center gap-2">
                            <div class="w-14 h-14 rounded-full bg-white/5 flex items-center justify-center border border-white/10 group-hover:border-primary-container/30 transition-colors">
                                <span class="font-black text-lg">${t2.substring(0,3)}</span>
                            </div>
                            <span class="font-bold text-sm truncate max-w-[60px]">${t2}</span>
                        </div>
                    </div>
                    
                    <div class="px-5 pb-5">
                        <div class="w-full bg-surface-container-highest h-1 rounded-full overflow-hidden mb-3">
                            <div class="bg-primary-container h-full ${isLive ? 'w-[80%] neon-glow' : 'w-0'}"></div>
                        </div>
                        <button onclick="joinContest('${info.matchId}', '${t1}', '${t2}', '${format}')" class="w-full border border-white/20 py-2.5 rounded-lg text-sm font-bold hover:bg-primary-container hover:text-on-primary-container hover:border-primary-container transition-all active:scale-95">
                            Join Contest
                        </button>
                    </div>
                </div>
            `;
        });
    }

    window.filterMatches = function(type, btnElement) {
        // Update button active states
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        if (type === 'All') {
            renderMatches(allMatches);
        } else {
            const filtered = allMatches.filter(m => {
                const format = m.matchInfo ? m.matchInfo.matchFormat : m.matchFormat;
                return format === type;
            });
            renderMatches(filtered);
        }
    }

    window.joinContest = function(matchId, team1, team2, format) {
        localStorage.setItem("selectedMatchId", matchId);
        localStorage.setItem("selectedMatchTeams", `${team1} vs ${team2}`);
        localStorage.setItem("selectedMatchFormat", format);
        window.location.href = "join-contest.html";
    }

    // Load matches on page load
    fetchMatches();
</script>

</body>
</html>
