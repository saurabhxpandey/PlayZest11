<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches - PlayZest11</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

/* ===== RESPONSIVE ===== */
@media (max-width: 992px) {
    .matches-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .matches-grid {
        grid-template-columns: 1fr;
    }

    .teams {
        flex-direction: column;
        align-items: center;
    }

    .vs {
        margin: 10px 0;
    }

    .header .container {
        flex-direction: column;
        align-items: flex-start;
    }
}

</style>
</head>

<body>

<script>
window.user = JSON.parse(localStorage.getItem("user"));
if (!window.user || !window.user.loggedIn) {
    window.location.href = "index.html";
}
</script>

<header class="header">
<div class="container">

    <h2><i class="fas fa-trophy"></i> PlayZest11</h2>

    <nav class="nav">
        <a href="#">Matches</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

    <div class="user-menu">
        <i class="fas fa-user"></i>
        <span id="user-name"></span>
    </div>

   <a href="wallet.html" class="wallet" style="text-decoration: none; color: inherit;">
    ₹<span id="wallet">0</span>
</a>

</div>
</header>

<section class="matches-section">
<div class="container">

    <div class="section-header">
        <h2>Upcoming Matches</h2>

        <div class="match-filters">
            <button class="filter-btn active" data-type="all">All</button>
            <button class="filter-btn" data-type="ipl">IPL</button>
            <button class="filter-btn" data-type="t10">T10</button>
            <button class="filter-btn" data-type="international">International</button>
        </div>
    </div>

    <div id="matches-list" class="matches-grid"></div>

</div>
</section>

<script>

// ===== USER =====
document.getElementById("user-name").innerText =
    window.user?.name || window.user?.email || "User";

function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

// ===== FIREBASE =====
const firebaseConfig = {
 apiKey: "AIzaSyDTJE-s-UPrvL3824m8kakqUCZHYbAPpug",
  authDomain: "playzest11.firebaseapp.com",
  projectId: "playzest11"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// SAFE USER ID
const userId = (window.user?.uid || window.user?.email || "guest")
    .replace(/[.#$/[\]]/g, "_");

// ===== WALLET =====
let wallet = 0;

function initWallet() {
    const ref = db.collection("users").doc(userId);

    ref.get().then(doc => {
        if (!doc.exists) {
            ref.set({ wallet: 0 });
        }
    });

    ref.onSnapshot(doc => {
        if (doc.exists) {
            wallet = doc.data().wallet || 0;
            document.getElementById("wallet").innerText = wallet;
        }
    });
}

initWallet();

// ===== MATCHES =====
let matches = [];
let currentFilter = "all";

function getType(m) {
    const text = (m.seriesName || "").toLowerCase();
    if (text.includes("ipl")) return "ipl";
    if (text.includes("t10")) return "t10";
    return "international";
}

function formatDate(d) {
    return new Date(d).toLocaleString();
}

async function fetchMatches() {

    const container = document.getElementById("matches-list");
    container.innerHTML = "<p>Loading matches...</p>";

    try {
        const res = await fetch(
            "https://api.cricketdata.org/v1/matches?apikey=efa33d67-4814-4f14-a6fc-fd249b9de00b"
        );

        const data = await res.json();

        let list = [];

        if (data?.data) {
            data.data.forEach(m => {
                list.push({
                    id: m.id,
                    team1: m.team1 || "Team A",
                    team2: m.team2 || "Team B",
                    date: m.date,
                    format: m.type || "T20",
                    type: getType(m)
                });
            });
        }

        matches = list;
        applyFilter();

    } catch (err) {
        container.innerHTML = "<p>Failed to load matches</p>";
        console.log(err);
    }
}

        

// ===== RENDER =====
function render(data) {
    const container = document.getElementById("matches-list");

    if (!data.length) {
        container.innerHTML = "<p>No matches found</p>";
        return;
    }

    container.innerHTML = data.map(m => `
        <div class="match-card">
            <div class="top-row">
                <span class="live-tag">UPCOMING</span>
                <span>${m.format}</span>
            </div>

            <div class="teams">
                <div>${m.team1}</div>
                <div class="vs">VS</div>
                <div>${m.team2}</div>
            </div>

            <div class="match-time">${formatDate(m.date)}</div>

            <button class="join-btn" onclick="joinMatch('${m.id}')">
                Join ₹10
            </button>
        </div>
    `).join("");
}

// ===== FILTER =====
function applyFilter() {
    if (currentFilter === "all") {
        render(matches);
    } else {
        render(matches.filter(m => m.type === currentFilter));
    }
}

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelector(".active").classList.remove("active");
        btn.classList.add("active");

        currentFilter = btn.dataset.type;
        applyFilter();
    });
});

// ===== JOIN =====
function joinMatch(id) {
    if (wallet < 10) {
        alert("Insufficient balance");
        return;
    }

    window.location.href = "join-contest.html?match=" + id;
}

// ===== INIT =====
fetchMatches();
setInterval(fetchMatches, 30000);

</script>

</body>
</html>
