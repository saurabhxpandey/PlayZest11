<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - PlayZest11</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

</head>

<body>

<script>
// 🔐 LOGIN CHECK
const user = JSON.parse(localStorage.getItem("user"));

if (!user || !user.loggedIn) {
    window.location.href = "index.html";
}
</script>

<header class="header">
    <div class="container">
        <h2>🏆 PlayZest11</h2>

        <div>
            👤 <span id="user-name"></span> |
            💰 ₹<span id="wallet">0</span> |
            <button onclick="logout()">Logout</button>
        </div>
    </div>
</header>

<div id="matches-list"></div>

<script>
// ================= FIREBASE CONFIG =================
const firebaseConfig = {
    apiKey: "AIzaSyA6TMMSZUSUX7HhV2G3T4OVaYyrDko4jqk",
  authDomain: "mydreamteam-94f4c.firebaseapp.com",
  projectId: "mydreamteam-94f4c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ================= USER =================
document.getElementById("user-name").innerText =
    user?.name || user?.email;

const userId = user?.uid || user?.email;

// ================= WALLET =================
let wallet = 0;

// 🔥 REALTIME WALLET LISTENER
db.collection("users").doc(userId)
.onSnapshot(doc => {
    if (doc.exists) {
        wallet = doc.data().wallet || 0;
        document.getElementById("wallet").innerText = wallet;
    }
});

// ================= LOGOUT =================
function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

// ================= MATCH FETCH =================
let matches = [];

async function fetchMatches() {
    try {
        const res = await fetch(
            'https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live',
            {
                headers: {
                    'X-RapidAPI-Key': '36c74f9de6msh67bcfa168a28b51p1bbc47jsn33c882a98652',
                    'X-RapidAPI-Host': 'cricbuzz-cricket.p.rapidapi.com'
                }
            }
        );

        const data = await res.json();

        let list = [];

        data.typeMatches?.forEach(type => {
            type.seriesMatches?.forEach(series => {
                series.seriesAdWrapper?.matches?.forEach(m => {

                    const info = m.matchInfo;

                    list.push({
                        id: info.matchId,
                        team1: info.team1?.teamName,
                        team2: info.team2?.teamName,
                        date: new Date(Number(info.startDate)).toLocaleString()
                    });
                });
            });
        });

        matches = list;
        render();

    } catch (err) {
        console.log(err);
    }
}

// ================= RENDER =================
function render() {
    const container = document.getElementById("matches-list");
    container.innerHTML = "";

    matches.forEach(m => {
        container.innerHTML += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
            <h3>${m.team1} vs ${m.team2}</h3>
            <p>${m.date}</p>
            <button onclick="joinMatch('${m.id}')">
                Join ₹10
            </button>
        </div>
        `;
    });
}

// ================= JOIN MATCH =================
async function joinMatch(matchId) {

    if (wallet < 10) {
        alert("Insufficient balance!");
        return;
    }

    try {
        await db.collection("users").doc(userId).update({
            wallet: wallet - 10
        });

        window.location.href =
            "join-contest.html?match=" + matchId;

    } catch (err) {
        console.log("Error:", err);
    }
}

// ================= LOAD =================
fetchMatches();

</script>

</body>
</html>
