<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches -PlayZest11</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

<!-- 🔐 AUTO LOGIN CHECK -->
<script>
    const user = JSON.parse(localStorage.getItem("user"));
      if (!user || !user.loggedIn) {
      window.location.href = "index.html";
}


</script>

<header class="header">
    <div class="container">
        <div class="logo">
            <h2><i class="fas fa-trophy"></i> PlayZest11</h2>
        </div>

        <nav class="nav">
            <a href="matches.html" class="nav-link active">Matches</a>
            <a href="index.html" class="nav-link" onclick="logout()">Logout</a>
        </nav>

        <div class="user-menu">
            <i class="fas fa-user"></i>
            <span id="user-name"></span>
        </div>

        <a href="wallet.html" class="wallet-link">
            <div class="wallet">
                💰 ₹<span id="wallet">0</span>
            </div>
        </a>
    </div>
</header>

<section class="matches-section">
    <div class="container">

        <div class="section-header">
            <h2>Upcoming Matches</h2>

            <div class="match-filters">
                <button class="filter-btn active" data-type="all">All</button>
                <button class="filter-btn" data-type="ipl">IPL</button>
                <button class="filter-btn" data-type="t10">T10</button>
                <button class="filter-btn" data-type="international">International</button>
            </div>
        </div>

        <div id="matches-list" class="matches-grid"></div>

    </div>
</section>
<script>

// ================= USER =================


document.getElementById("user-name").innerText =
    user?.name || user?.email || "User";

function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

// ================= FIREBASE =================
const firebaseConfig = {
   apiKey: "AIzaSyDTJE-s-UPrvL3824m8kakqUCZHYbAPpug",
  authDomain: "playzest11.firebaseapp.com",
  projectId: "playzest11"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const userId = user?.uid || user?.email;

// ================= WALLET =================
let wallet = 0;

// 🔥 create + fetch + realtime
function initWallet() {
    const ref = db.collection("users").doc(userId);

    ref.get().then(doc => {
        if (!doc.exists) {
            ref.set({ wallet: 100 });
        }
    });

    ref.onSnapshot(doc => {
        if (doc.exists) {
            wallet = doc.data().wallet || 0;
            document.getElementById("wallet").innerText = wallet;
        }
    });
}

initWallet();

// ================= MATCH DATA =================
let matches = [];
let currentFilter = "all";

// ================= FETCH MATCHES =================
async function fetchMatches() {
    try {
        const res = await fetch(
            "https://api.cricapi.com/v1/currentMatches?apikey=efa33d67-4814-4f14-a6fc-fd249b9de00b&offset=0"
        );

        const data = await res.json();

        console.log(data);

        let list = [];

        data.data.forEach(m => {
            list.push({
                id: m.id, // 🔥 CricAPI match id
                team1: m.teams[0],
                team2: m.teams[1],
                date: m.dateTimeGMT,
                format: m.matchType,
                type: "international"
            });
        });

        matches = list;
        applyFilter();

    } catch (err) {
        console.log(err);
    }
}

     async function init() {
    const res = await fetch(
        "https://api.cricapi.com/v1/currentMatches?apikey=efa33d67-4814-4f14-a6fc-fd249b9de00b&offset=0"
    );

    const data = await res.json();

    console.log(data);
}

init();

        let list = [];

        data.typeMatches?.forEach(type => {
            type.seriesMatches?.forEach(series => {
                series.seriesAdWrapper?.matches?.forEach(m => {

                    const info = m.matchInfo || {};

                    list.push({
                        id: info.matchId,
                        team1: info.team1?.teamName || "Team A",
                        team2: info.team2?.teamName || "Team B",
                        date: Number(info.startDate),
                        format: info.matchFormat || "T20",
                        series: info.seriesName || "",
                        type: getType(info)
                    });

                });
            });
        });

        matches = list;
        applyFilter();

    catch (err) {
        console.log("API Error:", err);
    }


// ================= TYPE =================
function getType(m) {
    const text = (m.seriesName || "").toLowerCase();

    if (text.includes("ipl")) return "ipl";
    if (text.includes("t10")) return "t10";

    return "international";
}

// ================= DATE =================
function formatDate(d) {
    const date = new Date(Number(d));
    return date.toLocaleString();
}

// ================= RENDER =================
function render(data) {
    const container = document.getElementById("matches-list");
    container.innerHTML = "";

    if (!data || data.length === 0) {
        container.innerHTML = "<p>No matches found</p>";
        return;
    }

    let html = "";

    data.forEach(m => {
        html += `
        <div class="match-card-new">
            <div class="top-row">
                <span class="live-tag">UPCOMING</span>
                <span class="match-format">${m.format}</span>
            </div>

            <div class="teams">
                <div class="team">
                    <div class="team-name">${m.team1}</div>
                </div>

                <div class="vs">VS</div>

                <div class="team">
                    <div class="team-name">${m.team2}</div>
                </div>
            </div>

            <div class="match-time">
                ${formatDate(m.date)}
            </div>

            <div class="bottom-row">
                <button onclick="joinMatch('${m.id}')" class="join-btn">
                    Join ₹10
                </button>
            </div>
        </div>
        `;
    });

    container.innerHTML = html;
}

// ================= FILTER =================
function applyFilter() {
    if (currentFilter === "all") {
        render(matches);
    } else {
        render(matches.filter(m => m.type === currentFilter));
    }
}

// ================= FILTER BTN =================
document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelector(".filter-btn.active").classList.remove("active");
        btn.classList.add("active");

        currentFilter = btn.dataset.type;
        applyFilter();
    });
});

// ================= JOIN MATCH =================
async function joinMatch(id) {

   if (wallet < 10) {
         window.location.href = "join-contest.html?match=" + id;
        return;
    }

    // ❌ wallet deduction हटा दिया
    // await ref.update({ wallet: wallet - 10 });

    // ✅ सिर्फ redirect
    window.location.href = "join-contest.html?match=" + id;
}

// ================= INIT =================
fetchMatches();
setInterval(fetchMatches, 30000);

</script>

</body>
</html>
