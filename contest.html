<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>My Team | PlayZest11</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-level-1 {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }
        body {
            background-color: #0c1609;
            color: #dae6d0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Pitch Background Gradient */
        .pitch-bg {
            background: linear-gradient(to bottom, #106e00 0%, #053900 100%);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .pitch-line {
            position: absolute;
            border: 1px dashed rgba(255,255,255,0.3);
        }
    </style>
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#2ae500",
                      "primary-container": "#39ff14",
                      "on-primary-container": "#107100",
                      "on-surface-variant": "#baccb0",
                      "background": "#0c1609",
                      "surface-container-highest": "#2d3828",
                      "on-surface": "#dae6d0",
                      "surface": "#0c1609",
                      "error": "#ffb4ab",
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container pb-20">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-lg shadow-black/20">
    <div class="flex items-center w-full px-5 h-16 max-w-7xl mx-auto">
        <a href="matches.html" class="mr-4 text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="text-xl font-bold">My Squad</h1>
        <div class="ml-auto">
            <button onclick="editTeam()" class="glass-level-1 px-4 py-1.5 rounded-full text-xs font-bold text-white hover:bg-white/10 transition-all flex items-center gap-1">
                <span class="material-symbols-outlined text-[16px]">edit</span> Edit
            </button>
        </div>
    </div>
</header>

<main class="pt-24 px-5 max-w-lg mx-auto">
    <div id="no-team-msg" class="hidden text-center py-20">
        <div class="w-20 h-20 bg-surface-container-highest rounded-full flex items-center justify-center mx-auto mb-4 border border-white/10">
            <span class="material-symbols-outlined text-4xl text-on-surface-variant">group_off</span>
        </div>
        <h2 class="text-xl font-bold text-white mb-2">No Team Selected</h2>
        <p class="text-on-surface-variant mb-6 text-sm">You haven't created a team for this match yet.</p>
        <a href="matches.html" class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-bold neon-glow transition-transform active:scale-95 inline-block">Go to Matches</a>
    </div>

    <div id="team-view" class="hidden">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-black text-primary-container mb-1 tracking-tight">YOUR ELITE XI</h2>
            <p class="text-xs text-on-surface-variant uppercase tracking-widest font-semibold" id="match-title">Match ID: Loading...</p>
        </div>

        <!-- Role Counters -->
        <div class="grid grid-cols-4 gap-2 mb-6 text-center">
            <div class="glass-level-1 rounded-lg py-2 border border-white/5">
                <div class="text-[10px] text-on-surface-variant font-bold uppercase">WK</div>
                <div id="wk-count" class="text-lg font-black text-white">0</div>
            </div>
            <div class="glass-level-1 rounded-lg py-2 border border-white/5">
                <div class="text-[10px] text-on-surface-variant font-bold uppercase">BAT</div>
                <div id="bat-count" class="text-lg font-black text-white">0</div>
            </div>
            <div class="glass-level-1 rounded-lg py-2 border border-white/5">
                <div class="text-[10px] text-on-surface-variant font-bold uppercase">AR</div>
                <div id="ar-count" class="text-lg font-black text-white">0</div>
            </div>
            <div class="glass-level-1 rounded-lg py-2 border border-white/5">
                <div class="text-[10px] text-on-surface-variant font-bold uppercase">BOWL</div>
                <div id="bowl-count" class="text-lg font-black text-white">0</div>
            </div>
        </div>

        <!-- Visual Pitch Representation -->
        <div class="pitch-bg w-full rounded-2xl p-4 min-h-[500px] flex flex-col justify-around shadow-2xl mb-8 overflow-hidden">
            <!-- Pitch lines -->
            <div class="pitch-line w-full top-1/4 left-0"></div>
            <div class="pitch-line w-full top-1/2 left-0"></div>
            <div class="pitch-line w-full top-3/4 left-0"></div>
            
            <div id="pitch-wk" class="flex justify-center flex-wrap gap-4 relative z-10"></div>
            <div id="pitch-bat" class="flex justify-center flex-wrap gap-4 relative z-10"></div>
            <div id="pitch-ar" class="flex justify-center flex-wrap gap-4 relative z-10"></div>
            <div id="pitch-bowl" class="flex justify-center flex-wrap gap-4 relative z-10"></div>
        </div>
        
        <button onclick="window.location.href='matches.html'" class="w-full border border-white/20 text-white font-bold text-lg py-3 rounded-lg hover:bg-white/10 active:scale-95 transition-all mb-8">
            Back to Dashboard
        </button>
    </div>
</main>

<!-- Bottom Navigation Bar for Mobile & Desktop -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-highest/90 backdrop-blur-xl border-t border-white/10 pb-safe">
    <div class="flex justify-around items-center h-16 max-w-7xl mx-auto px-2">
        <a href="matches.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">sports_cricket</span>
            <span class="text-[10px] font-semibold">Matches</span>
        </a>
        <a href="contest.html" class="flex flex-col items-center justify-center w-full h-full text-primary-container relative">
            <div class="absolute -top-1 w-8 h-1 bg-primary-container rounded-b-full"></div>
            <span class="material-symbols-outlined mb-1">groups</span>
            <span class="text-[10px] font-semibold">My Team</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">account_balance_wallet</span>
            <span class="text-[10px] font-semibold">Wallet</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">person</span>
            <span class="text-[10px] font-semibold">Profile</span>
        </a>
    </div>
</nav>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user || !user.loggedIn) {
        window.location.href = "login.html";
    }

    const teamData = localStorage.getItem("team");
    const matchId = localStorage.getItem("matchId") || "Unknown";

    if (!teamData) {
        document.getElementById("no-team-msg").classList.remove("hidden");
    } else {
        document.getElementById("team-view").classList.remove("hidden");
        document.getElementById("match-title").innerText = `Match ID: ${matchId}`;

        const team = JSON.parse(teamData);
        
        const roles = { WK: [], BAT: [], AR: [], BOWL: [] };
        
        team.forEach(player => {
            if (roles[player.role]) {
                roles[player.role].push(player);
            } else {
                roles.BAT.push(player); // fallback
            }
        });

        // Update counters
        document.getElementById("wk-count").innerText = roles.WK.length;
        document.getElementById("bat-count").innerText = roles.BAT.length;
        document.getElementById("ar-count").innerText = roles.AR.length;
        document.getElementById("bowl-count").innerText = roles.BOWL.length;

        // Render Pitch
        function createPlayerNode(p) {
            return `
                <div class="flex flex-col items-center w-[70px]">
                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-lg border border-black/10 overflow-hidden mb-1">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=2d3828&color=39ff14" class="w-full h-full object-cover">
                    </div>
                    <div class="bg-black/80 backdrop-blur-sm text-white text-[9px] font-bold px-1.5 py-0.5 rounded truncate w-full text-center border border-white/10">
                        ${p.name.split(' ')[0]}
                    </div>
                    <div class="text-[8px] font-black text-white/80 mt-0.5">${p.credit} Cr</div>
                </div>
            `;
        }

        document.getElementById("pitch-wk").innerHTML = roles.WK.map(createPlayerNode).join("");
        document.getElementById("pitch-bat").innerHTML = roles.BAT.map(createPlayerNode).join("");
        document.getElementById("pitch-ar").innerHTML = roles.AR.map(createPlayerNode).join("");
        document.getElementById("pitch-bowl").innerHTML = roles.BOWL.map(createPlayerNode).join("");
    }

    window.editTeam = function() {
        if(matchId && matchId !== "Unknown") {
            window.location.href = `join-contest.html?match=${matchId}`;
        } else {
            window.location.href = "matches.html";
        }
    }
</script>

</body>
</html>
