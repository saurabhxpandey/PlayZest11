<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - PlayZest11</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<!-- 🔐 AUTO LOGIN CHECK -->
<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user || !user.loggedIn) {
    window.location.href = "index.html";
}
</script>

<header class="header">
    <div class="container">
        <div class="logo">
            <h2><i class="fas fa-trophy"></i> PlayZest11</h2>
        </div>
        <nav class="nav">
            <a href="matches.html" class="nav-link">Matches</a>
            <a href="#" class="nav-link" onclick="logout()">Logout</a>
        </nav>
        <div class="user-menu">
            <i class="fas fa-user"></i>
            <span id="user-name"></span>
        </div>
        <a href="wallet.html" class="wallet-link">
            <div class="wallet">
                💰 ₹<span id="wallet-balance">0</span>
            </div>
        </a>
    </div>
</header>

<section class="wallet-section">
    <div class="container">
        <div class="section-header">
            <h2>My Wallet</h2>
            <p>Manage your PlayZest11 balance</p>
        </div>

        <!-- Balance Card -->
        <div class="wallet-card">
            <div class="balance-display">
                <h1>₹<span id="current-balance">0</span></h1>
                <p id="user-info"></p>
            </div>
        </div>

        <div class="wallet-actions">
            <!-- Deposit -->
            <div class="action-card deposit-card">
                <h3><i class="fas fa-plus-circle"></i> Deposit</h3>
                <div class="amount-options">
                    <button class="amount-btn" data-amount="100">₹100</button>
                    <button class="amount-btn" data-amount="500">₹500</button>
                    <button class="amount-btn" data-amount="1000">₹1000</button>
                    <button class="amount-btn" data-amount="2000">₹2000</button>
                </div>
                <p class="secure-note">100% Secure • Instant</p>
            </div>

            <!-- Withdraw -->
            <div class="action-card withdraw-card">
                <h3><i class="fas fa-minus-circle"></i> Withdraw</h3>
                <form id="withdraw-form">
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="withdraw-amount" min="50" max="50000" required>
                    </div>
                    <div class="form-group">
                        <label>Bank/UPI ID</label>
                        <input type="text" id="withdraw-account" placeholder="e.g. john@paytm or 1234567890" required>
                    </div>
                    <div class="form-group">
                        <label>Account Holder</label>
                        <input type="text" id="withdraw-name" required>
                    </div>
                    <button type="submit" class="withdraw-btn">Request Withdrawal</button>
                </form>
                <p class="withdraw-note">Min ₹50 • Processed in 24-48 hrs</p>
            </div>
        </div>
    </div>
</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔐 USER
const userId = user.email.toLowerCase();
    
    document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("user-name").innerText =
        user?.name || user?.email || "User";

    document.getElementById("user-info").innerText =
        `Hi, ${user?.name || user?.email || "User"}!`;

    loadWallet();
});
// 🔥 FIREBASE INIT
const firebaseConfig = {
  apiKey: "AIzaSyDTJE-s-UPrvL3824m8kakqUCZHYbAPpug",
  authDomain: "playzest11.firebaseapp.com",
  projectId: "playzest11"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 💰 WALLET
let wallet = 0;

async function loadWallet() {
    try {
        const ref = doc(db, "users", userId);
        const snapshot = await getDoc(ref);

        if (!snapshot.exists()) {
            await setDoc(ref, { wallet: 0 });
            wallet = 0;
        } else {
            wallet = snapshot.data().wallet || 0;
        }

        updateUI();

    } catch (err) {
        console.log("Wallet Error:", err);
    }
}

function updateUI() {
    document.getElementById("wallet-balance").innerText = wallet;
    document.getElementById("current-balance").innerText = wallet;
}

// 🔥 START
document.addEventListener("DOMContentLoaded", () => {
    loadWallet();
});

// ➕ UPDATE
async function updateWallet(amount) {
    wallet += amount;
    if (wallet < 0) wallet = 0;

    await setDoc(doc(db, "users", userId), {
    wallet: wallet
}, { merge: true });

    updateUI();
}


function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

// ================= DEPOSIT =================
document.querySelectorAll('.amount-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const amount = parseInt(this.dataset.amount);
        openRazorpay(amount);
    });
});

// 🔥 FIXED RAZORPAY
function openRazorpay(amount) {

    var options = {
        key: "rzp_test_SUgayesX5AYTkg", 
        amount: amount * 100,
        currency: "INR",
        name: "PlayZest11",
        description: `Deposit ₹${amount}`,

        handler: async function (response) {

            await updateWallet(amount);

            alert(`✅ ₹${amount} added successfully!\nPayment ID: ${response.razorpay_payment_id}`);
        },

        prefill: {
            name: user?.name || user?.email,
            email: user?.email
        },

        theme: {
            color: "#ff6b35"
        }
    };

    var rzp = new Razorpay(options);
    rzp.open();
}

// ================= WITHDRAW =================
document.getElementById('withdraw-form').onsubmit = async function(e) {
    e.preventDefault();

    const amount = parseInt(document.getElementById('withdraw-amount').value);

    if (amount > wallet) {
        alert('❌ Insufficient balance!');
        return;
    }

    if (amount < 50) {
        alert('❌ Minimum ₹50');
        return;
    }

    await updateWallet(-amount);

    const ownerPhone = '7673019496';
    const account = document.getElementById('withdraw-account').value;
    const name = document.getElementById('withdraw-name').value;

    const message = `🚀 WITHDRAWAL REQUEST\n\nUser: ${name} (${user.email})\nAmount: ₹${amount}\nAccount: ${account}`;

    const whatsappUrl = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;

    window.open(whatsappUrl, '_blank');

    alert(`✅ Withdrawal request sent! ₹${amount} deducted.`);
    this.reset();
};
</script>
</body>
</html>
