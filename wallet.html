<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - PlayZest11</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<!-- 🔐 AUTO LOGIN CHECK -->
<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user || !user.loggedIn) {
    window.location.href = "index.html";
}
</script>

<header class="header">
    <div class="container">
        <div class="logo">
            <h2><i class="fas fa-trophy"></i> PlayZest11</h2>
        </div>
        <nav class="nav">
            <a href="matches.html" class="nav-link">Matches</a>
            <a href="#" class="nav-link" onclick="logout()">Logout</a>
        </nav>
        <div class="user-menu">
            <i class="fas fa-user"></i>
            <span id="user-name"></span>
        </div>
        <a href="wallet.html" class="wallet-link">
            <div class="wallet">
                💰 ₹<span id="wallet-balance">0</span>
            </div>
        </a>
    </div>
</header>

<section class="wallet-section">
    <div class="container">
        <div class="section-header">
            <h2>My Wallet</h2>
            <p>Manage your PlayZest11 balance</p>
        </div>

        <!-- Balance Card -->
        <div class="wallet-card">
            <div class="balance-display">
                <h1>₹<span id="current-balance">0</span></h1>
                <p id="user-info"></p>
            </div>
        </div>

        <div class="wallet-actions">
            <!-- Deposit -->
            <div class="action-card deposit-card">
                <h3><i class="fas fa-plus-circle"></i> Deposit</h3>
                <div class="amount-options">
                    <button class="amount-btn" data-amount="100">₹100</button>
                    <button class="amount-btn" data-amount="500">₹500</button>
                    <button class="amount-btn" data-amount="1000">₹1000</button>
                    <button class="amount-btn" data-amount="2000">₹2000</button>
                </div>
                <p class="secure-note">100% Secure • Instant</p>
            </div>

            <!-- Withdraw -->
            <div class="action-card withdraw-card">
                <h3><i class="fas fa-minus-circle"></i> Withdraw</h3>
                <form id="withdraw-form">
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="withdraw-amount" min="50" max="50000" required>
                    </div>
                    <div class="form-group">
                        <label>Bank/UPI ID</label>
                        <input type="text" id="withdraw-account" placeholder="e.g. john@paytm or 1234567890" required>
                    </div>
                    <div class="form-group">
                        <label>Account Holder</label>
                        <input type="text" id="withdraw-name" required>
                    </div>
                    <button type="submit" class="withdraw-btn">Request Withdrawal</button>
                </form>
                <p class="withdraw-note">Min ₹50 • Processed in 24-48 hrs</p>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // User info
    document.getElementById("user-name").innerText = user?.name || user?.email || "User";
    document.getElementById("user-info").innerText = `Hi, ${user?.name || user?.email || "User"}!`;

    // Load wallet
    loadWallet();
});

// Wallet functions
function getWallet() {
    return parseInt(localStorage.getItem("wallet") || "100");
}

function updateWallet(amount) {
    let wallet = getWallet() + amount;
    if (wallet < 0) wallet = 0;
    localStorage.setItem("wallet", wallet);
    document.getElementById("wallet-balance").innerText = wallet;
    document.getElementById("current-balance").innerText = wallet;
}

function loadWallet() {
    const wallet = getWallet();
    document.getElementById("wallet-balance").innerText = wallet;
    document.getElementById("current-balance").innerText = wallet;
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

// Deposit - Razorpay
document.querySelectorAll('.amount-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const amount = parseInt(this.dataset.amount);
        initRazorpay(amount);
    });
});

function initRazorpay(amount) {
    const options = {
        key: 'rzp_test_QW6TX8uqb7khlDPFIHTynKBP', // Test key - REPLACE WITH LIVE
        amount: amount * 100,
        currency: 'INR',
        name: 'PlayZest11',
        description: `Deposit ₹${amount}`,
        image: 'https://via.placeholder.com/150x150/ff6b35/ffffff?text=PZ11',
        handler: function(response) {
            updateWallet(amount);
            alert(`✅ ₹${amount} added successfully! Payment ID: ${response.razorpay_payment_id}`);
        },
        prefill: {
            name: user.name || user.email,
            email: user.email
        },
        theme: {
            color: '#ff6b35'
        }
    };
    const rzp = new Razorpay(options);
    rzp.open();
}

// Withdraw
document.getElementById('withdraw-form').onsubmit = function(e) {
    e.preventDefault();
    
    const amount = parseInt(document.getElementById('withdraw-amount').value);
    const wallet = getWallet();
    
    if (amount > wallet) {
        alert('❌ Insufficient balance!');
        return;
    }
    
    if (amount < 50) {
        alert('❌ Minimum ₹50');
        return;
    }
    
    // Deduct
    updateWallet(-amount);
    
    // Owner WhatsApp msg (UPDATE PHONE NUMBER)
    const ownerPhone = '919876543210'; // YOUR NUMBER HERE
    const account = document.getElementById('withdraw-account').value;
    const name = document.getElementById('withdraw-name').value;
    const userEmail = user.email;
    
    const message = `🚀 WITHDRAWAL REQUEST\n\nUser: ${name} (${userEmail})\nAmount: ₹${amount}\nAccount: ${account}\n\nProcess ASAP!`;
    
    const whatsappUrl = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;
    
    // Open WhatsApp
    window.open(whatsappUrl, '_blank');
    
    alert(`✅ Withdrawal request sent! ₹${amount} deducted. Check WhatsApp.`);
    this.reset();
};
</script>

</body>
</html>
