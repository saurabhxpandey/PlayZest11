<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Wallet | PlayZest11</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        .glass-level-1 {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }
        body {
            background-color: #0c1609;
            color: #dae6d0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input {
            background: rgba(0,0,0,0.2) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: #dae6d0 !important;
        }
        .form-input:focus {
            border-color: #39ff14 !important;
            box-shadow: 0 0 5px rgba(57, 255, 20, 0.5) !important;
        }
    </style>
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#2ae500",
                      "primary-container": "#39ff14",
                      "on-primary-container": "#107100",
                      "on-surface-variant": "#baccb0",
                      "background": "#0c1609",
                      "surface-container-highest": "#2d3828",
                      "on-surface": "#dae6d0",
                      "surface": "#0c1609",
                      "error": "#ffb4ab",
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container pb-20">

<!-- 🔐 AUTO LOGIN CHECK -->
<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user || !user.loggedIn) {
    window.location.href = "login.html";
}
</script>

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-lg shadow-black/20">
    <div class="flex items-center justify-between w-full px-5 h-16 max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary-container">account_balance_wallet</span>
            <h1 class="text-xl font-bold">Wallet</h1>
        </div>
        <button onclick="logout()" class="text-xs font-semibold text-error hover:text-red-400 transition-colors">Logout</button>
    </div>
</header>

<main class="pt-24 px-5 max-w-lg mx-auto space-y-6">
    
    <!-- Balance Card -->
    <div class="glass-level-1 rounded-2xl p-6 border border-white/10 relative overflow-hidden text-center">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <p class="text-xs font-semibold uppercase tracking-widest text-on-surface-variant mb-2">Total Balance</p>
        <h1 class="text-5xl font-black text-white mb-2">₹<span id="current-balance">0</span></h1>
        <p id="user-info" class="text-sm text-primary-container font-medium"></p>
    </div>

    <!-- Deposit Section -->
    <div class="glass-level-1 rounded-xl p-5 border border-white/5">
        <div class="flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined text-primary-container">add_circle</span>
            <h3 class="font-bold text-lg">Add Money</h3>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
            <button class="amount-btn bg-white/5 hover:bg-primary-container/20 border border-white/10 hover:border-primary-container transition-colors py-2 rounded-lg font-bold" data-amount="100">₹100</button>
            <button class="amount-btn bg-white/5 hover:bg-primary-container/20 border border-white/10 hover:border-primary-container transition-colors py-2 rounded-lg font-bold" data-amount="500">₹500</button>
            <button class="amount-btn bg-white/5 hover:bg-primary-container/20 border border-white/10 hover:border-primary-container transition-colors py-2 rounded-lg font-bold" data-amount="1000">₹1000</button>
            <button class="amount-btn bg-white/5 hover:bg-primary-container/20 border border-white/10 hover:border-primary-container transition-colors py-2 rounded-lg font-bold" data-amount="2000">₹2000</button>
        </div>
        <p class="text-[10px] text-on-surface-variant text-center uppercase tracking-wider"><i class="fas fa-shield-alt text-primary-container"></i> 100% Secure • Instant Add</p>
    </div>

    <!-- Withdraw Section -->
    <div class="glass-level-1 rounded-xl p-5 border border-white/5">
        <div class="flex items-center gap-2 mb-4">
            <span class="material-symbols-outlined text-error">remove_circle</span>
            <h3 class="font-bold text-lg">Withdraw</h3>
        </div>
        
        <form id="withdraw-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Amount (₹)</label>
                <input type="number" id="withdraw-amount" class="form-input w-full rounded-lg px-4 py-2 outline-none transition-all" min="50" max="50000" placeholder="0" required>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Bank/UPI ID</label>
                <input type="text" id="withdraw-account" class="form-input w-full rounded-lg px-4 py-2 outline-none transition-all" placeholder="e.g. user@upi" required>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-1">Account Holder Name</label>
                <input type="text" id="withdraw-name" class="form-input w-full rounded-lg px-4 py-2 outline-none transition-all" placeholder="Enter name on account" required>
            </div>
            <button type="submit" class="w-full bg-white text-black font-bold text-md py-3 rounded-lg hover:bg-gray-200 active:scale-95 transition-all">
                Request Withdrawal
            </button>
        </form>
        <p class="text-[10px] text-on-surface-variant text-center uppercase tracking-wider mt-4">Min ₹50 • Processed in 24-48 hrs</p>
    </div>

</main>

<!-- Bottom Navigation Bar for Mobile & Desktop -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-highest/90 backdrop-blur-xl border-t border-white/10 pb-safe">
    <div class="flex justify-around items-center h-16 max-w-7xl mx-auto px-2">
        <a href="matches.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">sports_cricket</span>
            <span class="text-[10px] font-semibold">Matches</span>
        </a>
        <a href="contest.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">groups</span>
            <span class="text-[10px] font-semibold">My Team</span>
        </a>
        <a href="wallet.html" class="flex flex-col items-center justify-center w-full h-full text-primary-container relative">
            <div class="absolute -top-1 w-8 h-1 bg-primary-container rounded-b-full"></div>
            <span class="material-symbols-outlined mb-1">account_balance_wallet</span>
            <span class="text-[10px] font-semibold">Wallet</span>
        </a>
        <a href="profile.html" class="flex flex-col items-center justify-center w-full h-full text-on-surface-variant hover:text-white transition-colors">
            <span class="material-symbols-outlined mb-1">person</span>
            <span class="text-[10px] font-semibold">Profile</span>
        </a>
    </div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTJE-s-UPrvL3824m8kakqUCZHYbAPpug",
    authDomain: "playzest11.firebaseapp.com",
    projectId: "playzest11",
    storageBucket: "playzest11.firebasestorage.app",
    messagingSenderId: "465045882002",
    appId: "1:465045882002:web:7653d2ad9f26e7ecbe124b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 USER
const userId = user.email.toLowerCase();

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("user-info").innerText = `Hi, ${user?.name || user?.email || "User"}!`;
    loadWallet();
});

// 💰 WALLET
let wallet = 0;

async function loadWallet() {
    try {
        const ref = doc(db, "users", userId);
        const snapshot = await getDoc(ref);

        if (!snapshot.exists()) {
            await setDoc(ref, { wallet: 0 });
            wallet = 0;
        } else {
            wallet = snapshot.data().wallet || 0;
        }

        updateUI();

    } catch (err) {
        console.log("Wallet Error:", err);
    }
}

function updateUI() {
    document.getElementById("current-balance").innerText = wallet;
    localStorage.setItem("walletBalance", wallet); // Sync to localStorage for header
}

// ➕ UPDATE
async function updateWallet(amount) {
    wallet += amount;
    if (wallet < 0) wallet = 0;

    await setDoc(doc(db, "users", userId), {
        wallet: wallet
    }, { merge: true });

    updateUI();
}

window.logout = function() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

// ================= DEPOSIT =================
document.querySelectorAll('.amount-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const amount = parseInt(this.dataset.amount);
        openRazorpay(amount);
    });
});

// 🔥 FIXED RAZORPAY
function openRazorpay(amount) {
    var options = {
        key: "rzp_test_SUgayesX5AYTkg",
        amount: amount * 100,
        currency: "INR",
        name: "PlayZest11",
        description: `Deposit ₹${amount}`,
        config: {
            display: {
                blocks: {
                    banks: {
                        name: "Pay using UPI / Cards",
                        instruments: [
                            { method: "upi" },
                            { method: "card" },
                            { method: "netbanking" },
                            { method: "wallet" }
                        ]
                    }
                },
                sequence: ["block.banks"],
                preferences: { show_default_blocks: true }
            }
        },
        handler: async function (response) {
            await updateWallet(amount);
            alert(`✅ ₹${amount} added successfully!\nPayment ID: ${response.razorpay_payment_id}`);
        },
        prefill: {
            name: user?.name || user?.email,
            email: user?.email
        },
        theme: { color: "#39ff14" }
    };
    var rzp = new Razorpay(options);
    rzp.open();
}

// ================= WITHDRAW =================
document.getElementById('withdraw-form').onsubmit = async function(e) {
    e.preventDefault();

    const amount = parseInt(document.getElementById('withdraw-amount').value);

    if (amount > wallet) {
        alert('❌ Insufficient balance!');
        return;
    }

    if (amount < 50) {
        alert('❌ Minimum ₹50');
        return;
    }

    await updateWallet(-amount);

    const ownerPhone = '7673019496';
    const account = document.getElementById('withdraw-account').value;
    const name = document.getElementById('withdraw-name').value;

    const message = `🚀 WITHDRAWAL REQUEST\n\nUser: ${name} (${user.email})\nAmount: ₹${amount}\nAccount: ${account}`;
    const whatsappUrl = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;
    
    window.open(whatsappUrl, '_blank');

    alert(`✅ Withdrawal request sent! ₹${amount} deducted.`);
    this.reset();
};
</script>
</body>
</html>
