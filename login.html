<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login -PlayZest11</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h2><i class="fas fa-trophy"></i> PlayZest11</h2>
            </div>
            <nav>
                <a href="index.html">← Home</a>
            </nav>
        </div>
    </header>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h1>Welcome Back</h1>
                <p>Login to continue your fantasy journey</p>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="auth-btn">Login</button>
                </form>
                <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </section>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } 
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA6TMMSZUSUX7HhV2G3T4OVaYyrDko4jqk",
  authDomain: "mydreamteam-94f4c.firebaseapp.com",
  projectId: "mydreamteam-94f4c",
  appId: "1:298463861254:web:9512080e4d2eac95bf0187"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();

  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);

    // 🔐 Email verify check
    if (!userCredential.user.emailVerified) {
      alert("Please verify your email. 📧");
      return;
    }

    // ✅ LOCAL STORAGE SAVE
    localStorage.setItem("user", JSON.stringify({
      name: userCredential.user.displayName || userCredential.user.email,
      email: userCredential.user.email,
      loggedIn: true
    }));

    window.location.href = "matches.html";

  } catch (error) {

  console.log("Error Code:", error.code); 
  switch (error.code) {

    case "auth/user-not-found":
      alert("❌ User exist nahi karta. Pehle register karo.");
      break;

    case "auth/wrong-password":
      alert("❌ Password galat hai.");
      break;

    case "auth/invalid-email":
      alert("❌ Email format galat hai.");
      break;

    case "auth/invalid-credential":
      alert("❌ Email ya password galat hai.");
      break;

    case "auth/too-many-requests":
      alert("⚠️ Bahut zyada attempts. Thodi der baad try karo.");
      break;

    default:
      alert("Error: " + error.message);
  }
}
};
</script>
</body>
</html>
