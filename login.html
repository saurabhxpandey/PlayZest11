<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Login | PlayZest11</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass-level-1 {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
        }
        body {
            background-color: #0c1609;
            color: #dae6d0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .form-input {
            background: rgba(0,0,0,0.2) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: #dae6d0 !important;
        }
        .form-input:focus {
            border-color: #39ff14 !important;
            box-shadow: 0 0 5px rgba(57, 255, 20, 0.5) !important;
        }
    </style>
    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#2ae500",
                      "primary-container": "#39ff14",
                      "on-primary-container": "#107100",
                      "on-surface-variant": "#baccb0",
                      "background": "#0c1609",
                      "on-surface": "#dae6d0",
                      "surface": "#0c1609",
              }
            }
          }
        }
    </script>
</head>
<body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-lg shadow-black/20">
    <div class="flex justify-between items-center w-full px-5 h-16 max-w-7xl mx-auto">
        <div class="flex items-center gap-2">
            <i class="fas fa-trophy text-primary-container text-2xl"></i>
            <span class="text-2xl font-black tracking-tighter text-primary-container">PlayZest11</span>
        </div>
        <nav>
            <a href="index.html" class="text-sm font-semibold text-on-surface-variant hover:text-primary-container transition-colors duration-300">← Home</a>
        </nav>
    </div>
</header>

<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-5">
    <div class="glass-level-1 w-full max-w-md p-8 rounded-2xl border border-white/10 shadow-2xl relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-sm text-on-surface-variant">Login to manage your elite team</p>
        </div>

        <form id="login-form" class="space-y-5 relative z-10">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant mb-2">Email Address</label>
                <input type="email" id="login-email" class="form-input w-full rounded-lg px-4 py-3 outline-none transition-all" placeholder="Enter your email" required>
            </div>
            <div>
                <div class="flex justify-between mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant">Password</label>
                    <a href="#" onclick="resetPassword()" class="text-xs font-medium text-primary-container hover:underline">Forgot?</a>
                </div>
                <input type="password" id="login-password" class="form-input w-full rounded-lg px-4 py-3 outline-none transition-all" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="w-full bg-primary-container text-on-primary-container font-bold text-lg py-3 rounded-lg neon-glow active:scale-95 transition-all mt-4">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-on-surface-variant mt-8 relative z-10">
            Don't have an account? <a href="register.html" class="text-primary-container font-semibold hover:underline">Register here</a>
        </p>
    </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTJE-s-UPrvL3824m8kakqUCZHYbAPpug",
    authDomain: "playzest11.firebaseapp.com",
    projectId: "playzest11",
    storageBucket: "playzest11.firebasestorage.app",
    messagingSenderId: "465045882002",
    appId: "1:465045882002:web:7653d2ad9f26e7ecbe124b"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔐 LOGIN
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();

  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value.trim();

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // Removed email verification check so test accounts can log in

    localStorage.setItem("user", JSON.stringify({
      name: user.displayName || user.email,
      email: user.email,
      loggedIn: true
    }));

    alert("Login successful ✅");
    window.location.href = "matches.html";

  } catch (error) {
    switch (error.code) {
      case "auth/user-not-found": alert("User not found. Please register."); break;
      case "auth/wrong-password": alert("Wrong password."); break;
      case "auth/invalid-email": alert("Invalid email."); break;
      case "auth/invalid-credential": alert("Wrong email or password."); break;
      case "auth/too-many-requests": alert("Too many attempts. Try later."); break;
      default: alert(error.message);
    }
  }
};

// 🔥 RESET PASSWORD FUNCTION
window.resetPassword = async function () {
  const email = document.getElementById("login-email").value.trim();
  if (!email) {
    alert("Please enter your email first 📧");
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    alert("Password reset email sent! Check inbox 📩");
  } catch (error) {
    switch (error.code) {
      case "auth/user-not-found": alert("No account found with this email."); break;
      case "auth/invalid-email": alert("Invalid email format."); break;
      default: alert(error.message);
    }
  }
};
</script>

</body>
</html>
