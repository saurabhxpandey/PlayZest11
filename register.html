<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register -PlayZest11</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h2><i class="fas fa-trophy"></i> PlayZest11</h2>
            </div>
            <nav>
                <a href="index.html">← Home</a>
            </nav>
        </div>
    </header>

    <!-- Register Section -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <h1>Join PlayZest11</h1>
                <p>Create account to start winning</p>
                <form id="register-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="reg-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit" class="auth-btn">Register</button>
                </form>
                <p class="auth-link">Already have account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </section>

   <!-- Firebase SDK -->
<script type="module">
  // Import Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile, sendEmailVerification } 
     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // 🔥 Apna Firebase config yaha daalo
 const firebaseConfig = {
  apiKey: "AIzaSyDTJE-s-UPrvL3824m8kakqUCZHYbAPpug",
  authDomain: "playzest11.firebaseapp.com",
  projectId: "playzest11",
  storageBucket: "playzest11.firebasestorage.app",
  messagingSenderId: "465045882002",
  appId: "1:465045882002:web:7653d2ad9f26e7ecbe124b",
  measurementId: "G-TSS8JKGEDJ"
};

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Form submit
  document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();

    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;

    try {
      // ✅ Create user
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);

      // ✅ Save name
      await updateProfile(userCredential.user, {
        displayName: name
      });

      // ✅ 📩 Send verification email
      await sendEmailVerification(userCredential.user);

      alert("Verification email sent! Please check your inbox 📧");
        

    } catch (error) {
      alert(error.message);
    }
  };
</script>
</body>
</html>
