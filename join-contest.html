<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container">
        <div class="logo">
            <h2>🏏 Create Team</h2>
        </div>
    </div>
</header>

<section class="contest-section">
    <div class="container">

        <!-- MATCH INFO -->
        <div class="match-info">
            <h1>Select Your Team</h1>
            <div class="contest-details">
                Players: <span id="count">0</span>/11 | Credits: <span id="credits">100</span>
            </div>
        </div>

        <!-- TEAM BUILDER -->
        <div class="team-builder">

            <!-- PLAYERS -->
            <div id="players-list" class="players-grid"></div>

            <!-- SELECTED PLAYERS -->
            <div class="team-summary">
                <h3>Selected Players:</h3>
                <div id="selected-list" class="selected-players"></div>

                <div class="team-actions">
                    <button onclick="saveTeam()" class="submit-team">
                        Submit Team
                    </button>
                </div>
            </div>

        </div>

    </div>
</section>

<script>

// LOGIN CHECK
const user = JSON.parse(localStorage.getItem("user"));
if (!user || !user.loggedIn) {
    window.location.href = "index.html";
}

// MATCH ID
const params = new URLSearchParams(window.location.search);
const matchId = params.get("match");

// STATE
let players = [];
let selected = [];
let credits = 100;

// ROLE HELPER
function getRole(role) {
    if (!role) return "BAT";

    role = role.toLowerCase();

    if (role.includes("wk") || role.includes("keeper")) return "WK";
    if (role.includes("bowl")) return "BOWL";
    if (role.includes("all")) return "AR";

    return "BAT";
}

// ✅ MAIN FUNCTION (ONLY ONE API USED)
async function fetchPlayers() {
    try {
        const res = await fetch(
            `https://cricbuzz-cricket.p.rapidapi.com/mcenter/v1/${matchId}`,
            {
                method: 'GET',
                headers: {
                    'X-RapidAPI-Key': '36c74f9de6msh67bcfa168a28b51p1bbc47jsn33c882a98652',
                    'X-RapidAPI-Host': 'cricbuzz-cricket.p.rapidapi.com'

        // TEAM 1
        data?.matchInfo?.team1?.playerDetails?.forEach(p => {
            squadPlayers.push({
                name: p.name,
                role: getRole(p.role),
                credit: Math.floor(8 + Math.random() * 3)
            });
        });

        // TEAM 2
        data?.matchInfo?.team2?.playerDetails?.forEach(p => {
            squadPlayers.push({
                name: p.name,
                role: getRole(p.role),
                credit: Math.floor(8 + Math.random() * 3)
            });
        });

        // अगर players मिले
        if (squadPlayers.length > 0) {
            players = squadPlayers;
        } else {
            throw new Error("No squad data");
        }

    } catch (err) {
        console.log("API Error:", err);

        // ✅ fallback
        players = [
            { name: "Virat Kohli", role: "BAT", credit: 10 },
            { name: "Rohit Sharma", role: "BAT", credit: 9 },
            { name: "Hardik Pandya", role: "AR", credit: 9 },
            { name: "Jasprit Bumrah", role: "BOWL", credit: 9 },
            { name: "MS Dhoni", role: "WK", credit: 9 },
            { name: "KL Rahul", role: "BAT", credit: 9 },
            { name: "Shubman Gill", role: "BAT", credit: 9 },
            { name: "Ravindra Jadeja", role: "AR", credit: 9 },
            { name: "Mohammed Shami", role: "BOWL", credit: 9 },
            { name: "Surya Kumar Yadav", role: "BAT", credit: 9 },
            { name: "Rishabh Pant", role: "WK", credit: 9 }
        ];
    }

    renderPlayers();
}

// RENDER
function renderPlayers() {
    const container = document.getElementById("players-list");
    container.innerHTML = "";

    players.forEach((p, i) => {
        container.innerHTML += `
        <div class="player-card" onclick="togglePlayer(${i})">
            <div class="player-img">🏏</div>
            <h4>${p.name}</h4>
            <p>${p.role}</p>
            <p>${p.credit} Cr</p>
        </div>
        `;
    });
}

// SELECT PLAYER
function togglePlayer(i) {
    const player = players[i];

    if (selected.includes(i)) {
        selected = selected.filter(id => id !== i);
        credits += player.credit;
    } else {
        if (selected.length >= 11) {
            alert("Max 11 players!");
            return;
        }

        if (credits < player.credit) {
            alert("Not enough credits!");
            return;
        }

        selected.push(i);
        credits -= player.credit;
    }

    updateUI();
}

// UPDATE UI
function updateUI() {
    document.getElementById("count").innerText = selected.length;
    document.getElementById("credits").innerText = credits;

    document.querySelectorAll(".player-card").forEach((el, i) => {
        el.classList.toggle("selected", selected.includes(i));
    });

    const list = document.getElementById("selected-list");
    list.innerHTML = selected.map(i => `<span>${players[i].name}</span>`).join("");
}

// SAVE TEAM
function saveTeam() {
    if (selected.length !== 11) {
        alert("Select 11 players!");
        return;
    }

    const team = selected.map(i => players[i]);

    localStorage.setItem("team", JSON.stringify(team));
    localStorage.setItem("matchId", matchId);

    alert("Team Saved!");
    window.location.href = "contest.html";
}

// INIT
fetchPlayers();

</script>

</body>
</html>
